[project]
name = "h0melab-downloader"
version = "2.0.0"
authors = [{ name = "DasEric" }]
maintainers = [{ name = "DasEric" }]
description = "Browser-based downloader and media automation hub for a homelab."
readme = "README.md"
requires-python = ">=3.11"
# requires version numbers from 06/2026
dependencies = [
  "certifi",                                                                  # CA bundle for bundled runtimes
  "niquests",                                                                 # >=3.7
  "ffmpeg-python",                                                            # ???
  "python-dotenv",                                                            # >=3.10
  "flask",                                                                    # >=3.9
  "flask-wtf",                                                                # >=3.10
  "waitress",                                                                 # >=3.9.0
  "cryptography",                                                             # !=3.9.0, !=3.9.1, >=3.9
  "patchright",                                                               # >=3.9
  "curl_cffi",                                                                # TLS impersonation for Cloudflare-gated hosters (VOE)
  "yt-dlp",                                                                   # resilient multi-fragment transfer fallback
  "mutagen",                                                                  # Jellyfin/Plex audio tags
]


classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICENSE"]

[project.optional-dependencies]
sso = [
  "authlib",                                                                  # >=3.10
]
discord = [
  "discord.py",                                                               # optional Discord request bot
]
test = [
  "pytest",
]
all = [
  "authlib",
  "discord.py",
]


[project.urls]
Homepage = "https://github.com/DasEric/H0melab-Downloader-V2"
Repository = "https://github.com/DasEric/H0melab-Downloader-V2"
Documentation = "https://github.com/DasEric/H0melab-Downloader-V2#readme"
Changelog = "https://github.com/DasEric/H0melab-Downloader-V2/commits"
Issues = "https://github.com/DasEric/H0melab-Downloader-V2/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["h0melab*"]

[tool.setuptools.package-data]
h0melab = [
  ".env.example",
  "aniskip/scripts/*.lua",
  "web/templates/*.html",
  "web/static/*.css",
  "web/static/*.js",
  "web/static/*.ico",
  "web/static/*.png",
  "web/static/*.webp",
  "web/static/flags/*.svg",
  "web/static/flags/LICENSE.txt",
  "browsers.jsonl",
]

[project.scripts]
h0melab-downloader = "h0melab.web_entry:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Always test this checkout instead of a different globally/editably installed copy.
pythonpath = ["src"]
# The two legacy scripts in tests/ are manual smoke checks against the live
# sites. They expose no test functions, so pytest collects nothing from them.
python_files = ["test_*.py"]
addopts = "--strict-markers"
